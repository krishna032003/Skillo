version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      PORT: 8000
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    restart: always

  frontend:
    image: node:20-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    command: >
      sh -c "npm install && npm run build && npm start"
    depends_on:
      - backend
    restart: always
